name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --shard=${{ matrix.shard }}/3

  # Quarantined wall-clock tests. CI is set on the Linux shards, test-windows, and
  # coverage, so those jobs skip the listed tests. #687 was seen on windows-latest,
  # so this job runs on both runners. CDP_RUN_QUARANTINED=1 opts them back in.
  # A flake stays visible and does not fail the workflow. Windows uses Git Bash and
  # --maxWorkers=2, matching test-windows.
  test-quarantined:
    name: test-quarantined (${{ matrix.os }})
    # Informational only, so it runs after merge and does not hold a PR.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # PowerShell is the Windows default. Git Bash matches test-windows.
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- ${{ matrix.os == 'windows-latest' && '--maxWorkers=2' || '' }} tests/issue-503-quoted-secret-tail.test.mjs tests/issue-511-escaped-json-and-netlog-bodies.test.mjs tests/issue-518-linear-timing-helper.test.mjs
        env:
          CDP_RUN_QUARANTINED: "1"

  # Portability gate (#463): GNU tar from Git for Windows, MSYS argv quoting, slower file I/O.
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash: the shell the issue was reported from, with GNU tar ahead of System32's bsdtar.
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Record which tar the tests will spawn (GNU from Git for Windows vs System32 bsdtar).
      - run: command -v tar && tar --version
      - run: npm test -- --maxWorkers=2

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:docs

  # Coverage was the slowest job (~15 min). It runs after merge on main so it
  # no longer sets PR wall time.
  coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage --maxWorkers=2
