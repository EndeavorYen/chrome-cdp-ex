name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to publish to npm (vX.Y.Z or X.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-and-deploy
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      publish: ${{ steps.readiness.outputs.ready == 'true' && steps.check.outputs.exists == 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: version
        run: echo "version=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Check changelog release readiness
        id: readiness
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          VERSION="${TAG#v}"
          # `## [version](`, `## [version] (date)`, or a bare `## [version]` line.
          if grep -Fq "## [$VERSION](" CHANGELOG.md \
            || grep -Fq "## [$VERSION] " CHANGELOG.md \
            || grep -Fxq "## [$VERSION]" CHANGELOG.md; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release for unreleased package candidate $TAG"
          fi

      - name: Check if tag exists
        if: steps.readiness.outputs.ready == 'true'
        id: check
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Only when this push would publish a new tag: notes still in changelog.d would be left out.
      - name: Check changelog fragments are folded
        if: steps.readiness.outputs.ready == 'true' && steps.check.outputs.exists == 'false'
        run: node scripts/changelog-fragments.mjs --release

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.readiness.outputs.ready == 'true' && steps.check.outputs.exists == 'false'
        with:
          node-version: '22'
          cache: npm

      # Release notes are the version section of CHANGELOG.md. Run
      # `npm run changelog:fold` before tagging so changelog.d fragments are
      # already in that file. This workflow reads CHANGELOG.md and does not fold.
      - name: Extract release notes from changelog
        if: steps.readiness.outputs.ready == 'true' && steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          VERSION="${TAG#v}"
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Validate and pack release tarball
        if: steps.readiness.outputs.ready == 'true' && steps.check.outputs.exists == 'false'
        id: pack
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          VERSION="${TAG#v}"
          npm ci
          npm test
          npm run lint
          npm run check:docs
          npm pack
          TARBALL="chrome-cdp-ex-${VERSION}.tgz"
          test -f "$TARBALL"
          npm run check:release-package -- "$TARBALL"
          CHECKSUM="$(shasum -a 256 "$TARBALL" | awk '{print $1}')"
          {
            echo ""
            echo "## Package"
            echo ""
            echo "- Asset: \`$TARBALL\`"
            echo "- SHA-256: \`$CHECKSUM\`"
            echo "- Includes cross-host manifests, validation scripts, CLI shim, setup script, and skills runtime."
          } >> release-notes.md
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Neutralize CLI @tokens in release notes
        if: steps.readiness.outputs.ready == 'true' && steps.check.outputs.exists == 'false'
        run: node scripts/sanitize-release-notes.mjs release-notes.md

      - name: Create release
        if: steps.readiness.outputs.ready == 'true' && steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: gh release create "$TAG" "$TARBALL" --notes-file release-notes.md --title "$TAG"

      - name: Upload packed release tarball
        if: steps.readiness.outputs.ready == 'true' && steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  # Manual recovery for an existing tag. The push job is skipped, so this still runs.
  npm-publish:
    needs: release
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.release.result == 'success' && needs.release.outputs.publish == 'true'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      # This checkout is the workflow ref (the push, or the branch selected for a manual re-run).
      # A manual re-run then checks the tag out under release-src so the publisher stays this copy.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version) }}
          path: release-src
          fetch-depth: 0

      - name: Require the existing release tag
        if: github.event_name == 'workflow_dispatch'
        working-directory: release-src
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [[ "$REQUESTED" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*$ ]]; then
            if [[ "$REQUESTED" == v* ]]; then TAG="$REQUESTED"; else TAG="v$REQUESTED"; fi
          else
            echo "version must be an existing release tag like vX.Y.Z" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${TAG}^{commit}")"
          PKG="$(node -p 'require("./package.json").version')"
          test "$PKG" = "${TAG#v}"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ github.event_name == 'workflow_dispatch' && 'release-src/package-lock.json' || 'package-lock.json' }}

      - name: Pack the tagged release
        if: github.event_name == 'workflow_dispatch'
        id: pack
        working-directory: release-src
        run: |
          npm ci
          npm pack --json > pack.json
          TARBALL="$(node -p 'const rows=require("./pack.json"); if(!Array.isArray(rows)||!rows[0]||typeof rows[0].filename!=="string"||rows[0].filename===""){process.stderr.write("npm pack did not report a tarball\n"); process.exit(1)} rows[0].filename')"
          rm -f pack.json
          test -f "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Download packed release tarball
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball

      - name: Install npm for trusted publishing
        run: |
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 14)) { console.error("Node " + process.version + " is older than 22.14"); process.exit(1); }'
          npm install -g 'npm@^11.5.1'

      - name: Publish packed tarball to npm
        working-directory: ${{ github.event_name == 'workflow_dispatch' && 'release-src' || '.' }}
        env:
          TARBALL: ${{ github.event_name == 'workflow_dispatch' && steps.pack.outputs.tarball || needs.release.outputs.tarball }}
        run: node "$GITHUB_WORKSPACE/scripts/npm-publish-tarball.mjs" "$TARBALL"
