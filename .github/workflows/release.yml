name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-and-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: version
        run: echo "version=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: '22'
          cache: npm

      - name: Extract release notes from changelog
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          VERSION="${TAG#v}"
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Validate and pack release tarball
        if: steps.check.outputs.exists == 'false'
        id: pack
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          VERSION="${TAG#v}"
          npm ci
          npm test
          npm run lint
          npm run check:docs
          npm run check:host-validation
          npm run check:contracts
          npm pack
          TARBALL="pi-chrome-cdp-${VERSION}.tgz"
          test -f "$TARBALL"
          npm run check:contracts -- --tarball "$TARBALL"
          npm run check:release-package -- "$TARBALL"
          CHECKSUM="$(shasum -a 256 "$TARBALL" | awk '{print $1}')"
          {
            echo ""
            echo "## Package"
            echo ""
            echo "- Asset: \`$TARBALL\`"
            echo "- SHA-256: \`$CHECKSUM\`"
            echo "- Includes cross-host manifests, validation scripts, Codex Killer Path evidence, demo media, CLI shim, setup script, and skills runtime."
          } >> release-notes.md
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: gh release create "$TAG" "$TARBALL" --notes-file release-notes.md --title "$TAG"
